kind = "web"
previewPath = "/"
title = "Teen Challenge Lietuva"
version = "1.0.0"
id = "artifacts/teen-challenge-lietuva"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 4173
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/teen-challenge-lietuva run dev"

[services.env]
PORT = "4173"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/teen-challenge-lietuva", "run", "build"]
publicDir = "artifacts/teen-challenge-lietuva/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
